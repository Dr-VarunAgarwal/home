<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Dr. Varun Agarwal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#5c8a8d; --teal-dark:#4b7275; --ink:#26333a; --text:#3a464c; --muted:#7c8a90; --line:#e5e8e6; --paper:#ffffff; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center;
  }
  .wrap{ max-width:560px; width:100%; margin:0 auto; padding:0 24px; }
  .code{ font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--teal); margin:0 0 12px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(32px, 7vw, 46px); line-height:1.1; color:var(--ink); margin:0 0 12px; }
  p{ color:var(--muted); line-height:1.7; margin:0 0 28px; }
  a.btn{
    display:inline-block; padding:11px 20px; border-radius:6px;
    background:var(--teal); color:#fff; text-decoration:none; font-weight:600; font-size:14px;
  }
  a.btn:hover{ background:var(--teal-dark); }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Page not found.</h1>
  <p>There's no page at this address.</p>
  <a class="btn" href="https://varunagarwal.com/">Back to varunagarwal.com</a>
</div>
</body>
</html>
